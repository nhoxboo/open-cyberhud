[platformio]
default_envs = esp32-2432s024

[env]
platform = espressif32@6.5.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1
    lovyan03/LovyanGFX@^1.1.12
    adafruit/Adafruit NeoPixel@^1.12.0
    bblanchon/ArduinoJson@^6.21.4

build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_NIMBLE_CPP_LOG_LEVEL=0

[env:esp32-2432s024]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_2432S024
board_build.partitions = min_spiffs.csv

[env:esp32-2424s012]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_2424S012
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
board_build.partitions = min_spiffs.csv

[env:esp32dev]
board = esp32dev
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32_ORIGINAL_CYBERHUD
board_build.partitions = min_spiffs.csv

[env:esp32-s3-devkit]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3_DEVKIT
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv

[env:esp32-s3-round-display]
board = esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32S3_ROUND_LCD_128
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = default_8MB.csv

[env:esp32-c3-supermini]
board = esp32-c3-devkitm-1
build_flags =
    ${env.build_flags}
    -DBOARD_ESP32C3_SUPERMINI
    -DARDUINO_USB_CDC_ON_BOOT=1
board_build.partitions = min_spiffs.csv
